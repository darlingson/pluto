[package]
name = "pluto"
version = "0.1.0"
edition = "2024"
description = "Keyboard-first terminal UI for PostgreSQL: browse tables, sort, filter, build joins without SQL, export CSV"
license = "Apache-2.0"
repository = "https://github.com/darlingson/pluto"

[dependencies]
tokio = { version = "1", features = ["full"] }
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "tls-rustls", "chrono", "uuid", "bigdecimal"] }
bigdecimal = "0.4"
uuid = { version = "1", features = ["v4"] }
serde_json = "1"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
dirs = "6"
ratatui = "0.29"
crossterm = "0.28"
unicode-width = "0.2"