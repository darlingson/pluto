name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # 22.04 for wider glibc compatibility on older distros
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            pattern: "*.tar.gz"
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            pattern: "*.zip"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package (Linux)
        if: matrix.os == 'ubuntu-22.04'
        run: |
          version="${GITHUB_REF_NAME#v}"
          tar czf "pluto-${version}-x86_64-linux.tar.gz" \
            -C "target/${{ matrix.target }}/release" pluto

      - name: Package (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $version = "${env:GITHUB_REF_NAME}".TrimStart("v")
          Compress-Archive -Path "target/${{ matrix.target }}/release/pluto.exe" `
            -DestinationPath "pluto-${version}-x86_64-windows.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.os }}
          path: ${{ matrix.pattern }}

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Collect artifacts
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist

      - name: Create release
        run: >
          gh release create "${GITHUB_REF_NAME}" dist/*
          --title "pluto ${GITHUB_REF_NAME}"
          --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
